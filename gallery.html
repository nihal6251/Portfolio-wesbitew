<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery - Alex Rivers Photography</title>
    <link rel="icon" type="image/x-icon" href="assets/images/favicon.ico">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600&display=swap"
        rel="stylesheet">

    <!-- CSS Files -->
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/themes.css">
    <link rel="stylesheet" href="css/gallery.css">
    
    <!-- Netlify Identity Widget -->
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>

<body class="light-theme">
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-brand">
                <a href="index.html#home">MK</a>
            </div>





            <!-- Navigation Menu -->
            <ul class="nav-menu" id="nav-menu">
                <li><a href="index.html#home" class="nav-link">Home</a></li>
                <li><a href="index.html#about" class="nav-link">About</a></li>
                <li><a href="index.html#photos" class="nav-link">Photos</a></li>
                <li><a href="index.html#videos" class="nav-link">Videos</a></li>
                <li><a href="index.html#experience" class="nav-link">Experience</a></li>
                <li><a href="index.html#contact" class="nav-link">Contact</a></li>
            </ul>

            <!-- Theme Toggle -->
            <div class="theme-toggle">
                <input type="checkbox" id="theme-switch" class="theme-switch-input">
                <label for="theme-switch" class="theme-switch-label">
                    <span class="theme-switch-slider">
                        <i class="fas fa-moon"></i>
                        <i class="fas fa-sun"></i>
                    </span>
                </label>
            </div>
        </div>
    </nav>

    <!-- Gallery Header -->
    <section class="gallery-header">
        <div class="container">
            <div class="gallery-navigation">
                <div class="gallery-title">
                    <h1 id="gallery-title">Photos Gallery</h1>
                    <p id="gallery-subtitle">Explore the collection</p>
                </div>
            </div>
        </div>
    </section>

    <!-- Gallery Content -->
    <section class="gallery-content">
        <div class="container">
            <div class="masonry-grid" id="masonry-grid">
                <!-- Photos will be loaded dynamically -->
            </div>
        </div>
    </section>

    <!-- Other Galleries Suggestions -->
    <section class="other-galleries">
        <div class="container">
            <div class="section-header">
                <h2 class="section-title">Explore Other Galleries</h2>
                <p>Discover more of my photography work</p>
            </div>

            <div class="galleries-suggestions" id="galleries-suggestions">
                <!-- Other galleries will be loaded dynamically -->
            </div>
        </div>
    </section>

    <!-- Lightbox -->
    <div id="lightbox" class="lightbox">
        <div class="lightbox-overlay"></div>
        <div class="lightbox-container">
            <button class="lightbox-close" id="lightbox-close">
                <i class="fas fa-times"></i>
            </button>

            <div class="lightbox-content">
                <img id="lightbox-image" src="" alt="">
            </div>

            <button class="lightbox-nav lightbox-prev" id="lightbox-prev">
                <i class="fas fa-chevron-left"></i>
            </button>
            <button class="lightbox-nav lightbox-next" id="lightbox-next">
                <i class="fas fa-chevron-right"></i>
            </button>
        </div>
    </div>

    <!-- Footer -->
    <!-- Footer -->
   
    <footer class="footer">

        <div class="footer-bottom">
            <p>&copy; 2025 Mehrajul Karim. All rights reserved.</p>
        </div>

    </footer>

    <!-- JavaScript Files -->
    <script src="js/main.js"></script>
    <script src="js/gallery.js"></script>
    
    <!-- Netlify Identity Widget -->
    <script>
      if (window.netlifyIdentity) {
        window.netlifyIdentity.on("init", user => {
          if (!user) {
            window.netlifyIdentity.on("login", () => {
              document.location.href = "/admin/";
            });
          }
        });
      }
    </script>
</body>

</html>
